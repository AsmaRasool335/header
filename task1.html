<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HireHub</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script
      src="https://kit.fontawesome.com/712a58c174.js"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      :root {
        --blue: #081a24;
        --text: #d1d0d0;
        --btn: #6f63ff;
        --navbar: #14113c;
        --btn-secondary: #d8d5ea;
      }

      header {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 40px;
        background: var(--navbar);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        color: var(--text);
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 20px;
        font-weight: 700;
      }

      .logo .icon {
        width: 34px;
        height: 34px;
        background: linear-gradient(135deg, #7c6bf0, #5b4bd6);
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        color: white;
      }

      .logo span.brand {
        color: #a99bff;
      }

      nav.nav-links {
        display: flex;
        gap: 22px;
      }

      nav.nav-links a {
        color: #d8d5ea;
        text-decoration: none;
        font-size: 15px;
        transition: color 0.2s;
        padding: 3px 10px;
        border-radius: 5px;
      }

      nav.nav-links a:hover {
        color: #fff;
      }

      .nav-right {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .post-job-btn {
        background: #6a5cf0;
        color: #fff;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }

      .post-job-btn:hover {
        background: #5847e0;
      }

      main {
        min-height: 90vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #fff;
        background: radial-gradient(
          circle at 50% 0%,
          #4b3fc9 0%,
          #241c66 45%,
          #120e33 100%
        );
        padding: 80px 20px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 7px 16px;
        border-radius: 999px;
        font-size: 14px;
        margin-bottom: 28px;
      }

      .dot {
        width: 10px;
        height: 10px;
        background: #27e85d;
        border-radius: 50%;
      }

      .number {
        letter-spacing: 0.5px;
        color: white;
      }

      h1 {
        font-size: 64px;
        font-weight: 700;
        margin-bottom: 18px;
      }

      p.subtitle {
        color: #d6d5f5;
        line-height: 1.7;
        margin: 0 0 40px 0;
      }

      .filters {
        background-color: rgba(0, 0, 0, 0.527);
        padding: 20px;
        border-radius: 20px;
      }

      .filter-button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 5px;
      }

      .filter {
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(20, 16, 46, 0.85);
        padding: 10px;
        border-radius: 10px;
        width: 250px;
        border: 1px solid #616060;
      }

      .filter input,
      select {
        background: transparent;
        border: none;
        color: var(--text);
        padding: 0px 10px;
        width: 100%;
      }

      .filter input:focus,
      select:focus {
        outline: none;
        box-shadow: none;
      }

      select {
        padding: 2.5px 14px;
      }

      select option {
        color: white;
        background: #00000088;
      }

      .search-btn {
        background: #6a5cf0;
        border: none;
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        border-radius: 10px;
        padding: 0 26px;
        height: 45px;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.2s;
      }

      .search-btn:hover {
        background: #5847e0;
      }

      .advanced {
        display: flex;
        gap: 4px;
        margin: 20px 0;
        justify-content: center;
        flex-wrap: wrap;
        align-items: center;
      }

      .advanced .badge {
        width: auto;
        font-weight: 500;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.2s;
      }

      .advanced .badge:hover {
        background: rgba(255, 255, 255, 0.18);
      }

      .advanced span {
        color: var(--text);
        margin: -27px 10px 0 0;
      }

      .menu-icon {
        display: none;
        color: var(--btn-secondary);
        cursor: pointer;
        transition: transform 0.3s ease;
      }

      .menu-icon i {
        color: var(--btn-secondary);
        font-size: 30px;
      }
      #themeBtn {
        background: transparent;
        border: none;
      }
      body.dark header {
        background: #ffffff;
        border-bottom: 1px solid #e5e7eb;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      body.dark .logo {
        color: #111827;
      }

      body.dark .logo span {
        color: #6f63ff;
      }
      body.dark nav a:hover {
        background: #6f63ff;
        color: white;
      }
      body.dark #themeBtn {
        color: #111827;
      }
      body.dark .logo .icon i {
        color: white;
      }
      body.dark .badge {
        background: #7063ff69;
        border: 1px solid #d6dcff;
        color: #4338ca;
      }
      body.dark .number {
        color: #4338ca;
      }

      body.dark .dot {
        background: #22c55e;
      }
      body.dark main {
        background: linear-gradient(
          180deg,
          #eef2ff 0%,
          #f8faff 50%,
          #ffffff 100%
        );
      }
      body.dark nav a {
        color: #374151;
      }
      body.dark h1 {
        color: #111827;
      }
      body.dark p,
      body.dark span {
        color: #6b7280;
      }

      body.dark .filters {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      body.dark .filter {
        background: #f9fafb;
        border: 1px solid #d1d5db;
      }
      body.dark .filter input,
      body.dark .filter select {
        color: #111827;
      }

      body.dark .filter input::placeholder {
        color: #6b7280;
      }

      body.dark select option {
        background: white;
        color: #111827;
      }

      body.dark i {
        color: #6f63ff;
      }

      body.dark .post-job-btn:hover,
      body.dark .search-btn:hover {
        background: #5847e0;
      }

      body.dark .advanced .badge {
        background: #7063ff69;
        color: #4338ca;
        border: 1px solid #e5e7eb;
      }
      .logo span {
        color: var(--btn);
        margin: 0 0 0 -10px;
      }
      body.dark .advanced .badge:hover {
        background: #eef2ff;
        color: #6f63ff;
      }
      body.dark .menu-icon i {
        color: #4338ca;
      }
      @media (max-width: 900px) {
        .menu-icon {
          display: block;
          margin: 0 0 0 20px;
        }

        nav.nav-links {
          display: none;
          flex-direction: column;
          gap: 0;
          position: absolute;
          top: 100%;
          left: 0;
          width: 100%;
          background: var(--navbar);
          padding: 10px 0;
          box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
          z-index: 20;
        }
        body.dark nav.nav-links {
          background: #ffffff;
        }
        nav.nav-links a {
          padding: 14px 40px;
          border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        nav.nav-links.active {
          display: flex;
        }

        .menu-icon.active i {
          transform: rotate(90deg);
        }

        h1 {
          font-size: 40px;
        }

        .filter-button {
          flex-direction: column;
        }

        .filter {
          width: 100%;
          max-width: 320px;
        }

        .category-select {
          min-width: unset;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <div class="icon"><i class="fa-solid fa-lock"></i></div>
        Hire <span>Hub</span>
      </div>

      <nav class="nav-links" id="navLinks">
        <a href="#">Jobs</a>
        <a href="#">Companies</a>
        <a href="#">About</a>
        <a href="#">Pricing</a>
        <a href="#">Blog</a>
        <a href="#">Contact</a>
      </nav>

      <div class="nav-right">
        <button id="themeBtn">🌙</button>

        <button class="post-job-btn">Post a Job</button>
        <div class="menu-icon" id="menubtn">
          <i class="bi bi-list"></i>
        </div>
      </div>
    </header>

    <main>
      <div class="badge">
        <span class="dot"></span>
        <span class="number">2500</span>
      </div>
      <h1>Find Your Dream Job</h1>
      <p class="subtitle">
        Search thousands of opportunities from top companies worldwide.
        <br />Your next career move starts here.
      </p>
      <div class="filters">
        <div class="filter-button">
          <div class="filter">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Job title, keyword" />
          </div>
          <div class="filter">
            <i class="bi bi-geo-alt"></i>
            <input type="text" placeholder="City, state, or remote" />
          </div>
          <div class="filter category-select">
            <select>
              <option>All Categories</option>
              <option>Frontend</option>
              <option>Backend</option>
              <option>UI/UX</option>
            </select>
          </div>

          <button class="search-btn">Search Jobs</button>
        </div>
        <hr />
        <p>
          <i class="fa-light fa-sliders"></i> Advanced Filters
          <i class="bi bi-chevron-down"></i>
        </p>
      </div>
      <div class="advanced">
        <span>Popular:</span>
        <div class="badge">React Developer</div>
        <div class="badge">Product Manager</div>
        <div class="badge">Data Scientist</div>
        <div class="badge">UX Designer</div>
        <div class="badge">DevOps Engineer</div>
        <div class="badge">Marketing Lead</div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script>
      const menuBtn = document.getElementById("menubtn");
      const navMenu = document.getElementById("navLinks");

      menuBtn.addEventListener("click", () => {
        navMenu.classList.toggle("active");
        menuBtn.classList.toggle("active");
      });

      navMenu.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", () => {
          navMenu.classList.remove("active");
          menuBtn.classList.remove("active");
        });
      });
      
      const themeBtn = document.getElementById("themeBtn");

      themeBtn.addEventListener("click", () => {
        document.body.classList.toggle("dark");

        if (document.body.classList.contains("dark")) {
          themeBtn.textContent = "☀️";
        } else {
          themeBtn.textContent = "🌙";
        }
      });
    </script>
  </body>
</html>
