<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/712a58c174.js"
      crossorigin="anonymous"
    ></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: cursive;
      }
      body {
        position: relative;
        background: #000;
      }
      nav {
        position: absolute;
        top: 0;
        left: 0;
        background: #200247;
        display: flex;
        align-items: center;
        padding: 20px 90px 10px;
        width: 100%;
        z-index: 1000;
        justify-content: space-between;
      }
      /* .nav-links {
        margin-left: auto;
      } */
      .logo {
        color: white;
        font-size: 20px;
        font-weight: 700;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .logo-icon i {
        color: #f51c76;
      }
      ul {
        list-style: none;
        display: flex;
        gap: 40px;
        align-items: center;
        padding: 0;
        margin: 0;
      }
      li a {
        text-decoration: none;
        color: white;
        font-size: 16px;
        white-space: nowrap;
      }
      li button {
        background: #f51c76;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 7px;
        display: flex;
        gap: 5px;
        align-items: center;
      }
      /* .menu-icon {
        margin-left: auto;
      } */
      .menu-icon i {
        display: none;
        color: white;
        font-size: 28px;
      }
      .side-bar {
        position: fixed;
        padding: 70px 0;
        top: 0;
        right: -650px;
        background: #200247;
        height: 100vh;
        width: 25%;
        display: flex;
        flex-direction: column;
        align-items: center;

        transition: 0.4s ease;
        z-index: 100;
      }
      .side-bar.active {
        right: 0;
      }
      .bi-filter-left {
        font-size: 20px;
        align-self: flex-end;
      }
      .side-bar .logo {
        margin-bottom: 20px;
        font-size: 24px;
        justify-content: center;
      }
      .side-bar ul {
        flex-direction: column;
        color: #f51c76;
        width: 100%;
        padding: 70px 0;
        border-top: 3px solid #f51c76;
        text-align: center;
        gap: 60px;
      }
      .side-bar ul li.bor {
        padding: 10px 2px;
        border-bottom: 2px solid #f51c76;
        width: 100%;
      }
      .side-bar ul li a {
        color: white;
        display: block;
      }

      .side-bar ul li button {
        color: white;
        padding: 8px 15px;
        margin-top: 50px;
      }
      nav.hide {
        display: none;
      }
      .side-bar #menuClose {
        position: absolute;
        top: 0;
        right: 5px;
      }
      @media (max-width: 900px) {
        nav {
          padding: 15px 20px;
        }

        nav ul li a {
          font-size: 15px;
        }
        nav ul li button {
          font-size: 15px;
          padding: 3px 7px;
          border-radius: 4px;
        }
      }
      @media (min-width: 781px) {
        .side-bar {
          display: none;
        }
        .menu-icon {
          display: none;
        }
        nav {
          display: flex;
        }
      }

      @media (max-width: 780px) {
        nav ul {
          display: none;
        }
        .menu-icon i {
          display: block;
        }
        .side-bar {
          display: flex;
          width: 40%;
        }
        .side-bar .logo {
          font-size: 20px;
        }
        .side-bar ul {
          gap: 20px;
          padding: 40px 0;
        }
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <nav>
      <div class="logo">
        <div class="logo-icon"><i class="bi bi-airplane-fill"></i></div>
        Xplore <i class="bi bi-filter-left"></i>
      </div>

      <div>
        <ul class="nav-links">
          <li><a href="#">Travel Guide</a></li>
          <li><a href="#">Famous Places</a></li>
          <li><a href="#">Contact Us</a></li>
          <li>
            <button><i class="bi bi-airplane-fill"></i>Bookings</button>
          </li>
        </ul>
        <div class="menu-icon" id="menuIcon">
          <i class="bi bi-list"></i>
        </div>
      </div>
    </nav>
    <div class="side-bar" id="sideBar">
      <div class="menu-icon" id="menuClose">
        <i class="bi bi-x-lg"></i>
      </div>
      <div class="logo">
        <div class="logo-icon"><i class="bi bi-airplane-fill"></i></div>
        Xplore<i class="bi bi-filter-left"></i>
      </div>
      <ul class="nav-links">
        <li class="bor"><a href="#">Travel Guide</a></li>
        <li class="bor"><a href="#">Famous Places</a></li>
        <li class="bor"><a href="#">Contact Us</a></li>
        <li>
          <button><i class="bi bi-airplane-fill"></i>Bookings</button>
        </li>
      </ul>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const menuIcon = document.getElementById("menuIcon");
      const sideBar = document.getElementById("sideBar");
      const nav = document.querySelector("nav");
      const menuClose = document.getElementById("menuClose");
      menuIcon.addEventListener("click", () => {
        sideBar.classList.add("active");
        nav.classList.toggle("hide");
      });
      menuClose.addEventListener("click", () => {
        sideBar.classList.remove("active");
        nav.classList.remove("hide");
      });
    </script>
  </body>
</html>
