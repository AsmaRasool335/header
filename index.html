<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      .container {
        background-image: url("bg-image.png");
        background-size: cover;
        height: 100vh;
        position: relative;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary: #67a8e6;
        --blue: #081a24;
        --navbar: #145c95;
        --text: #ffffff;
        --btn-secondary: #0d2430;
      }

      .contact-navbar {
        background: var(--blue);
        color: var(--text);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 30px;
        flex-wrap: wrap;
        font-size: 13px;
        gap: 15px;
        box-shadow: inset;
      }
      .address-timing {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }
      i {
        color: var(--primary);
      }
      .address,
      .timing,
      .number {
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .contact {
        display: flex;
        gap: 15px;
        align-items: center;
        flex-wrap: wrap;
      }
      .social-links {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .icon {
        background: white;
        border-radius: 50%;
        padding: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon:hover {
        transform: scale(1.1);
      }

      .social-links i {
        color: var(--btn-secondary);
        font-size: 14px;
      }
      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 31px;
        background: var(--navbar);
      }

      .logo h3 {
        color: var(--btn-secondary);
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
        font-size: 24px;
      }
      .page-links {
        display: flex;
        /* gap: 5px; */
      }
      .page-links a {
        text-decoration: none;
        color: var(--text);
        font-weight: 600;
        padding: 10px 15px;
        transition: color 0.3s ease;
        border-radius: 5px;
      }
      .page-links a:hover {
        color: var(--btn-secondary);
        background: rgba(4, 99, 250, 0.1);
      }
      .two {
        display: flex;
        align-items: center;
      }
      .search-bar {
        width: 300px;
        display: flex;
      }
      .search-bar input {
        padding: 10px 15px;
        border: none;
        border-radius: 7px 0 0 7px;
        outline: none;
        font-size: 14px;
      }
      .search-bar input:focus {
        box-shadow: none;
        outline: none;
      }
      .search-icon {
        padding: 10px 15px;
        background: var(--btn-secondary);
        width: auto;
        height: 100%;
        border-radius: 0px 7px 7px 0px;
        display: flex;
        align-items: center;
      }
      .search-icon i {
        color: white;
      }
      .btn2 {
        background: var(--btn-secondary);
        padding: 10px 15px;
        border: none;
        border-radius: 5px;
        color: white;
        margin: 0px 0px 0px -32px;
      }
      .btn {
        background: var(--btn-secondary);
        padding: 10px 15px;
        border: none;
        border-radius: 5px;
        color: white;
        margin: 0px 0px 0px 10px;
      }
      button:hover {
        background: #0350d4;
      }

      .menu-icon {
        display: none;
        color: var(--btn-secondary);
        cursor: pointer;
        transition: transform 0.3s ease;
      }
      .menu-icon i {
        color: var(--btn-secondary);
        font-size: 30px;
      }
      .one {
        display: flex;
        align-items: center;
      }
      .three {
        display: none;
      }
      @media (max-width: 992px) {
        .search-bar {
          display: none;
        }
        .contact,
        .address-timing {
          flex-direction: column;
          flex-wrap: nowrap;
          align-items: center;
        }
      }
      @media (max-width: 600px) {
        .menu-icon {
          display: block;
          margin: 0px 0px 0px 20px;
        }
        .one {
          display: none;
          flex-direction: column-reverse;
          width: 100%;
          background: var(--navbar);
          padding: 15px 0;
        }

        .one.active {
          display: flex;
          background: transparent;
        }
        .two {
          display: none;
        }
        nav {
          flex-wrap: wrap;
        }

        .page-links {
          width: 100%;
          flex-direction: column;
          text-align: center;
          margin: 8px 0;
        }
        .search-bar input {
          width: 100%;
        }
        .search-bar {
          width: 100%;
          display: flex;
        }
        .contact-navbar {
          display: none;
        }
        .three {
          display: block;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .three .sIcon {
          background: var(--btn-secondary);
          padding: 9px 10px;
          border-radius: 7px;
        }
        .three .sIcon i {
          color: white;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="contact-navbar">
        <div class="address-timing">
          <div class="address">
            <i class="bi bi-geo-alt-fill"></i>
            <p>Canal Road, Faisalabad, Pakistan</p>
          </div>
          <div class="timing">
            <i class="bi bi-clock"></i>
            <p>Mon-Fri: 09.00 AM - 09.00 PM</p>
          </div>
        </div>
        <div class="contact">
          <div class="number">
            <i class="bi bi-telephone"></i>
            <p>+92 3456798923</p>
          </div>
          <div class="social-links">
            <div class="icon">
              <a href="#"><i class="bi bi-facebook"></i></a>
            </div>
            <div class="icon">
              <a href="#"><i class="bi bi-twitter"></i></a>
            </div>
            <div class="icon">
              <a href="#"><i class="bi bi-linkedin"></i></a>
            </div>
            <div class="icon">
              <a href="#"><i class="bi bi-instagram"></i></a>
            </div>
          </div>
        </div>
      </div>
      <nav>
        <div class="logo">
          <h3>Brand</h3>
        </div>
        <div class="three">
          <div class="sIcon">
            <i class="bi bi-search"></i>
          </div>
          <button type="submit" class="btn">Login</button>
          <div class="menu-icon" id="menubtn">
            <i class="bi bi-list"></i>
          </div>
        </div>
        <div class="one">
          <div class="page-links" id="pageLinks">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Service</a>
            <a href="#">Pages</a>
            <a href="#">Contact</a>
          </div>
        </div>
        <div class="two">
          <div class="search-bar">
            <input type="text" placeholder="search" />
            <div class="search-icon">
              <i class="bi bi-search"></i>
            </div>
          </div>
          <button class="btn2" type="submit">Login</button>
        </div>
      </nav>
    </div>
    <script>
      const menuBtn = document.getElementById("menubtn");
      const navMenu = document.querySelector(".one");

      menuBtn.addEventListener("click", () => {
        navMenu.classList.toggle("active");
      });
    </script>
  </body>
</html>
